#
# Tells the Quarkus Agent MCP server where the extension reference documentation embeddings live.
# Copied into every extension deployment JAR by maven-resources-plugin, configured in the
# extensions, extensions-jvm and extensions-core aggregator poms.
#
# No version is given on purpose: the server resolves this artifact at the version of the extension
# whose deployment JAR carries this file.
#
# Requires quarkus-agent-mcp 1.2.8 or newer.
#
groupId=org.apache.camel.quarkus
artifactId=camel-quarkus-documentation-rag
