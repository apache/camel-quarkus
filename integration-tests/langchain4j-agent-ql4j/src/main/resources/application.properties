quarkus.native.resources.includes=rag/*,schemas/*
quarkus.http.test-timeout=120S

quarkus.devservices.enabled=false
quarkus.langchain4j.devservices.preload=false

# The custom AiService receives registered ai-tools (all-tools default for user-built
# services), so it needs a tool-capable model; orca-mini rejects requests carrying tools
agent.tests.custom-service-model-id=granite4:3b

# Configure a default QL4J model to trigger implied AI service registration for
# AiAgentWithoutMemoryService (reproduces https://github.com/apache/camel-quarkus/issues/8836)
quarkus.langchain4j.ollama.base-url=${langchain4j.ollama.base-url}
quarkus.langchain4j.ollama.chat-model.model-id=orca-mini
