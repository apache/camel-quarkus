ingest.test.directory=target/ingest-docs

# the Kafka test resource provides its own broker; Dev Services would otherwise start one more
# per test class, and fail the whole module on platforms without a container environment
quarkus.kafka.devservices.enabled=false

quarkus.camel.langchain4j.ingest.products.source.directory=${ingest.test.directory}
quarkus.camel.langchain4j.ingest.products.embedding-store=products-store
quarkus.camel.langchain4j.ingest.products.embedding-model=test-model
quarkus.camel.langchain4j.ingest.products.max-segment-size=120
quarkus.camel.langchain4j.ingest.products.max-overlap-size=20
# register defined purely in properties via camel.beans; the name has no dashes because Camel
# normalises dashed camel.beans keys to camelCase
camel.beans.propertiesRegister=\#class\:org.apache.camel.support.processor.idempotent.MemoryIdempotentRepository
camel.beans.propertiesRegister.cacheSize=5000
quarkus.camel.langchain4j.ingest.products.source.idempotent-repository=propertiesRegister

# parser pipelines: reports extracts PDF text in-process (tika); scans converts through a
# Docling Serve instance (docling), which the tests stub with WireMock - see
# IngestDoclingTestResource. scans stays off until that resource provides the serve URL
ingest.reports.directory=target/ingest-reports
quarkus.camel.langchain4j.ingest.reports.source.directory=${ingest.reports.directory}
quarkus.camel.langchain4j.ingest.reports.parser=tika
quarkus.camel.langchain4j.ingest.reports.embedding-store=reports-store
quarkus.camel.langchain4j.ingest.reports.embedding-model=test-model
quarkus.camel.langchain4j.ingest.reports.max-segment-size=120
quarkus.camel.langchain4j.ingest.reports.max-overlap-size=20

ingest.scans.directory=target/ingest-scans
quarkus.camel.langchain4j.ingest.scans.source.directory=${ingest.scans.directory}
quarkus.camel.langchain4j.ingest.scans.parser=docling
quarkus.camel.langchain4j.ingest.scans.embedding-store=scans-store
quarkus.camel.langchain4j.ingest.scans.embedding-model=test-model
quarkus.camel.langchain4j.ingest.scans.max-segment-size=120
quarkus.camel.langchain4j.ingest.scans.max-overlap-size=20
quarkus.camel.langchain4j.ingest.scans.enabled=false

camel.component.docling.use-docling-serve=true
camel.component.docling.docling-serve-url=${docling.serve.url:http://localhost:5001}

# consumer-fed pipeline; the document-id exercises the $simple{...} form and the register gives
# first-write-wins dedup by document id
quarkus.camel.langchain4j.ingest.custom.source.uri=direct:custom-feed
quarkus.camel.langchain4j.ingest.custom.source.document-id=$simple{header.CamelIngestDocumentId}
quarkus.camel.langchain4j.ingest.custom.source.idempotent-repository=test-register
# auto-create plus the CDI-produced test-register bean: the existing bean wins over auto-creation
quarkus.camel.langchain4j.ingest.custom.source.idempotent-repository-auto-create=true
quarkus.camel.langchain4j.ingest.custom.embedding-store=custom-store
quarkus.camel.langchain4j.ingest.custom.embedding-model=test-model
quarkus.camel.langchain4j.ingest.custom.max-segment-size=120
quarkus.camel.langchain4j.ingest.custom.max-overlap-size=20

# consumer-fed pipeline with a parser: the endpoint+parser combination, and the pre-parse
# document-id capture (a parsed document cannot forge its own id through Tika metadata headers)
quarkus.camel.langchain4j.ingest.htmlfeed.source.uri=direct:htmlfeed-feed
quarkus.camel.langchain4j.ingest.htmlfeed.parser=tika
quarkus.camel.langchain4j.ingest.htmlfeed.embedding-store=htmlfeed-store
quarkus.camel.langchain4j.ingest.htmlfeed.embedding-model=test-model
quarkus.camel.langchain4j.ingest.htmlfeed.max-segment-size=120
quarkus.camel.langchain4j.ingest.htmlfeed.max-overlap-size=20


# H2 through Dev Services (a separate process, no container) backs the JDBC register
quarkus.datasource.db-kind=h2

quarkus.camel.langchain4j.ingest.jdbcdocs.source.uri=direct:jdbcdocs-feed
quarkus.camel.langchain4j.ingest.jdbcdocs.source.idempotent-repository=jdbcRegister
quarkus.camel.langchain4j.ingest.jdbcdocs.embedding-store=jdbc-store
quarkus.camel.langchain4j.ingest.jdbcdocs.embedding-model=test-model
quarkus.camel.langchain4j.ingest.jdbcdocs.max-segment-size=120
quarkus.camel.langchain4j.ingest.jdbcdocs.max-overlap-size=20

# s3docs and events are declared in Java (ItBuilderPipelines) through the Endpoint DSL; they stay
# off until MinioTestResource / IngestKafkaTestResource provide a store and a broker
quarkus.camel.langchain4j.ingest.s3docs.enabled=false
quarkus.camel.langchain4j.ingest.events.enabled=false
