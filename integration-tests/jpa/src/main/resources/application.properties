jpa.model.packages=org.apache.camel.quarkus.component.jpa.it.model,org.apache.camel.processor.idempotent.jpa

# All persistence units share the default datasource. Its configuration is identical in every profile
# so that tests are run against a single database (and Dev Services container) instead of one per datasource and test profile
quarkus.datasource.db-kind=${cq.sqlJdbcKind:h2}
quarkus.datasource.jdbc.max-size=8

%dev,test,prod.quarkus.hibernate-orm.test.packages=${jpa.model.packages}
%dev,test,prod.quarkus.hibernate-orm.test.datasource=<default>
%dev,test,prod.quarkus.hibernate-orm.test.schema-management.strategy=drop-and-create

# single-resource-no-default profile to test a single named EntityManagerFactory bean without a default
%single-resource-no-default.quarkus.camel.routes-discovery.exclude-patterns=**/*
%single-resource-no-default.quarkus.hibernate-orm.singleA.packages=${jpa.model.packages}
%single-resource-no-default.quarkus.hibernate-orm.singleA.datasource=<default>
%single-resource-no-default.quarkus.hibernate-orm.singleA.schema-management.strategy=drop-and-create

# multi-resource-no-default profile to test multiple named EntityManagerFactory beans without a default
%multi-resource-no-default.quarkus.camel.routes-discovery.exclude-patterns=**/*
%multi-resource-no-default.quarkus.hibernate-orm.multiA.packages=${jpa.model.packages}
%multi-resource-no-default.quarkus.hibernate-orm.multiA.datasource=<default>
%multi-resource-no-default.quarkus.hibernate-orm.multiA.schema-management.strategy=drop-and-create
%multi-resource-no-default.quarkus.hibernate-orm.multiB.packages=${jpa.model.packages}
%multi-resource-no-default.quarkus.hibernate-orm.multiB.datasource=<default>
# multiA & multiB share the same database, so only one of them must manage the schema
%multi-resource-no-default.quarkus.hibernate-orm.multiB.schema-management.strategy=none
