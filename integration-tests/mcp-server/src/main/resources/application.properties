quarkus.camel.mcp-server.tags=conformance
quarkus.camel.mcp-server.tool-timeout=2000
# differs from tool-timeout, so that mixing up the two options fails a test
quarkus.camel.mcp-server.resource-timeout=6000
# a second MCP server, serving an application tool and resource under the name and uri of Camel ones
quarkus.mcp.server.other.http.root-path=/other-mcp
# the argSchema and outputSchema resources must be reachable in native mode
quarkus.native.resources.includes=schema/create-order.json,schema/order-status.json
