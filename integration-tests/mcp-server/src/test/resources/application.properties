# Required for Streamable HTTP subsidiary SSE test notifications.
quarkus.mcp.server.client-logging.default-level=DEBUG

# MCP native integration-test settings (also used by the packaged native runner)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8081
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,MCP-Protocol-Version,MCP-Session-Id,Last-Event-ID
quarkus.log.category."io.quarkiverse.mcp.server.http.runtime.HttpMcpServerRecorder".level=DEBUG
