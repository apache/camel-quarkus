# The LLM may time a long time to respond
quarkus.http.test-timeout=120S

quarkus.native.resources.includes=schema/product.json

# Set to false to skip OpenaiAudioTest when the target endpoint has no audio transcription support
openai.audio.enabled=true
# Set to false to skip OpenaiChatTest.chatWithImage when the target endpoint has no vision support
openai.vision.enabled=true

